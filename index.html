<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Savan × Sanu ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Georgia, serif;
  background: #070914;
  color: white;
  overflow-x: hidden;
}

/* STAR BACKGROUND */
body::before,
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background-image:
    radial-gradient(#fff 1px, transparent 1px),
    radial-gradient(#fff 1px, transparent 1px);
  background-size: 90px 90px, 150px 150px;
  background-position: 10px 20px, 60px 80px;
  opacity: .16;
}

/* ================= INTRO ================= */

#intro {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background:
    radial-gradient(circle at center, #20213b 0%, #090a16 55%, #04050b 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: opacity 1.2s ease, visibility 1.2s ease;
}

#intro.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.intro-content {
  width: 90%;
  max-width: 650px;
}

.intro-line {
  opacity: 0;
  transform: translateY(20px);
  animation: introAppear 1.5s forwards;
  font-size: clamp(25px, 6vw, 45px);
  line-height: 1.4;
  color: #f4e9ee;
}

.intro-line.second {
  animation-delay: 2.2s;
}

.intro-small {
  margin-top: 25px;
  opacity: 0;
  font-size: 17px;
  color: #c7bdc4;
  animation: introAppear 1.3s forwards;
  animation-delay: 4.2s;
}
